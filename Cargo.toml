[package]
name = "pam-idp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "PAM module offering a directory-password vs. SSO menu and an OAuth 2.0 Device Authorization Grant against an OpenID Connect provider"
license = "Apache-2.0"
repository = "https://github.com/charlie-horse/idp-pam"
readme = "README.md"
publish = false

[lib]
name = "pam_idp"
crate-type = ["cdylib", "rlib"]

[dependencies]
http = "=1.5.0"
oauth2 = { version = "=5.0.0", default-features = false }
openidconnect = { version = "=4.1.0", default-features = false }
pam-bindings = "=0.4.0"
qrcode = { version = "=0.14.1", default-features = false }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "=1.16.0", features = ["std"] }
secrecy = "=0.10.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
ureq = { version = "=3.5.2", default-features = false, features = ["rustls-no-provider"] }

[dev-dependencies]
httpmock = { version = "=0.9.0", default-features = false, features = ["https"] }
tempfile = "=3.27.0"

[profile.release]
panic = "unwind"
lto = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
